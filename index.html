<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>My Blog</h1>

    <nav>
      <a href="#home">Home</a>
      <a href="#login">Login</a>
      <a href="#register">Register</a>
      <a href="#dashboard">Dashboard</a>
      <a href="#create-blog">Create Blog</a>
    </nav>
  </header>


  <!-- HOME -->
  <section id="home" class="page-section">

    <h2>Welcome to My Blog</h2>

    <p>Share your thoughts and ideas with the world.</p>

    <div class="blog-card">

      <h3>My First Blog</h3>

      <p>This is my first blog post.</p>

      <button>Read More</button>

    </div>

  </section>


  <!-- LOGIN -->
  <section id="login" class="page-section">

    <div class="form-box">

      <h2>Login</h2>

      <form>

        <input type="email" placeholder="Email" required>

        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>

      </form>

    </div>

  </section>


  <!-- REGISTER -->
  <section id="register" class="page-section">

    <div class="form-box">

      <h2>Register</h2>

      <form>

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email" required>

        <input type="password" placeholder="Password" required>

        <button type="submit">Register</button>

      </form>

    </div>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboard" class="page-section">

    <h2>Dashboard</h2>

    <p>Welcome to your blog dashboard.</p>

    <div class="dashboard-card">

      <h3>Total Blogs</h3>

      <p>1</p>

    </div>

    <div id="blog-list"></div>

  </section>


  <!-- CREATE BLOG -->
  <section id="create-blog" class="page-section">

    <div class="form-box">

      <h2>Create New Blog</h2>

      <form>

        <input
          type="text"
          placeholder="Blog Title"
          required
        >

        <textarea
          placeholder="Write your blog here..."
          required
        ></textarea>

        <button type="submit">
          Publish Blog
        </button>

      </form>

    </div>

  </section>

</body>

</html>
